<style>

e:12px}.task-card{background:#f2f6ff;border:1px solid #dfe9fc;border-radius:23px;padding:18px}.composer{display:grid;grid-template-columns:1fr auto;gap:9px}.composer input{min-width:0;border:1px solid #dfe3eb;background:white;border-radius:14px;padding:13px 14px;font-size:15px}.primary{background:var(--blue);border:0;border-radius:13px;color:white;font-weight:750;padding:0 17px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}.options select,.options input{width:100%;min-width:0;border:1px solid #e1e5ed;border-radius:11px;padding:10px 9px;background:#fff;color:#404956;font-size:12px}.task-list{padding-top:6px}.task{display:flex;align-items:center;gap:10px;border-top:1px solid #dfe5f0;padding:15px 1px}.task:first-child{border-top:none}.task-main{min-width:0;flex:1}.task-name{font-weight:700;font-size:15px;word-break:break-word}.task.done .task-name{text-decoration:line-through;color:#9aa2b0}.task-meta{font-size:11px;color:#8791a3;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pill{font-size:10px;color:#5e6e8a;border:1px solid #dbe3f2;background:#fff;padding:3px 7px;border-radius:99px}.actions{display:flex;gap:4px;align-items:center}.mini{background:#fff;border:1px solid #dce2eb;border-radius:50%;width:34px;height:34px;font-size:15px;color:#5c6675}.mini.active{background:#e1f4e8;color:#24844a;border-color:#b7e5c8}.mini.partial{background:#fff2d9;color:#a16705;border-color:#f8dba5}.mini.failed{background:#ffe9e9;color:#c74a4a;border-color:#f3caca}.trash{border:none;background:none;color:#c66a70;font-size:11px;font-weight:700;padding:6px}.empty{font-size:13px;color:#9ca3af;padding:16px 0 7px;text-align:center}.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{border:1px solid var(--line);border-radius:16px;text-align:center;padding:15px 4px;background:white}.stat span{font-size:12px;color:#7e8797}.stat strong{display:block;font-size:28px;margin-top:5px}.stat .green{color:#23925c}.stat .amber{color:#b98323}.stat .red{color:#cd5252}.moods{display:flex;gap:10px;flex-wrap:wrap}.mood{border:1px solid #e4e7ef;background:#f6f7fa;border-radius:50%;width:52px;height:52px;font-size:27px;display:grid;place-items:center}.mood.selected{background:#eaf3ff;border:2px solid #4b94f6;transform:translateY(-2px)}textarea{width:100%;margin-top:16px;border:1px solid #dde2ea;background:#fff;border-radius:17px;min-height:128px;resize:vertical;padding:15px;line-height:1.6;font-size:14px}.signature-box{background:#f7f8fb;border-radius:18px;padding:20px 16px}.signature-box label{display:block;color:#6d7789;font-size:12px;margin-bottom:10px}.signature-box input{background:transparent;border:0;border-bottom:1px solid #aab3c1;width:100%;padding:7px;font-size:18px;text-align:center}.button-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.secondary{border:1px solid #dde3ed;background:#fff;border-radius:28px;color:var(--blue);padding:11px 15px;font-size:13px;font-weight:700}.footnote{font-size:11px;color:#9aa1ad;line-height:1.6;margin-top:16px}.floating-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafbff;border:1px solid #ebedf4;padding:11px 13px;border-radius:14px;color:#788396;font-size:12px}.floating-note strong{color:#52617b}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#27364a;color:white;padding:11px 18px;border-radius:18px;font-size:13px;display:none;z-index:5;box-shadow:0 8px 30px #0002}@media(max-width:520px){.shell{padding:16px 10px 35px}.paper{padding:20px 14px}.hero h2{font-size:28px}.task-card{padding:13px}.options{grid-template-columns:1fr 1fr}.task{gap:5px}.task-name{font-size:14px}.mini{width:31px;height:31px}.mood{width:48px;height:48px;font-size:25px}.task-meta{font-size:10px}.trash{padding:4px}}
[hidden]{display:none!important}.task-card{background:var(--soft);border-color:var(--blue)}.date-controls{flex-wrap:nowrap}.date-controls input{width:155px;min-width:0;text-align:center}.hero .today{margin-top:12px}.task{flex-wrap:wrap}.progress-note{flex-basis:100%;background:white;border-radius:12px;padding:12px;font-size:13px;color:#927020}.progress-note textarea{min-height:70px;margin-top:8px}.mood.selected{border-color:var(--blue);background:var(--soft)}#fire{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}#settings label{display:inline-block;margin:12px 6px 0 0}.mini{font-size:20px}.actions{flex-shrink:0}

<body><div class="shell"><header class="top"><a href="/" aria-label="返回主頁" style="color:inherit;text-decoration:none">‹ 返回</a><button class="secondary" id="settingsBtn">⚙ 設定</button></header><main class="paper"><section id="settings" hidden><div class="section-head"><h3>主題設定</h3></div><div id="themes" class="button-row"></div><label class="secondary">自訂顏色 <input type="color" id="customColor" value="#c29a37"></label><label><input type="checkbox" id="animation" checked> 完成煙火</label><hr class="rule"></section><section class="hero"><h2>每日待辦</h2><div class="date-controls"><button type="button" id="prev" aria-label="前一天">‹</button><input id="day" type="date" aria-label="選擇日期"><button type="button" id="next" aria-label="後一天">›</button></div><p class="lunar" id="weekday"></p><button class="secondary today" id="today">回到今天</button></section><hr class="rule"><section><div class="section-head"><h3>今日待辦事項</h3><small id="taskCounter">0 件任務</small></div><div class="task-card"><form hidden class="composer" id="taskForm"><input id="taskName" maxlength="120" placeholder="寫下今天要完成的事…" required><button class="primary" type="submit">新增</button></form><div class="options" hidden><select id="quadrant" aria-label="四象限分類"><option value="重要且緊急">重要且緊急</option><option value="重要不緊急" selected>重要不緊急</option><option value="緊急較不重要">緊急較不重要</option><option value="不緊急不重要">不緊急不重要</option></select><select id="taskType" aria-label="重複方式"><option value="當日任務">當日任務</option><option value="每日固定">每日固定</option></select></div><div class="topthree" id="topthree"></div><div class="task-list" id="taskList"></div></div></section><hr class="rule"><section><div class="section-head"><h3>每日固定</h3><small id="fixedCounter">0 件任務</small></div><div class="task-card"><div class="task-list" id="fixedList"></div></div></section><hr class="rule"><section><div class="section-head"><h3>本日心情</h3></div><div class="moods" id="moods"><button class="mood" data-mood="🥰" aria-label="非常開心">🥰</button><button class="mood" data-mood="😊" aria-label="開心">😊</button><button class="mood" data-mood="😐" aria-label="普通">😐</button><button class="mood" data-mood="😔" aria-label="低落">😔</button><button class="mood" data-mood="😣" aria-label="疲憊">😣</button></div><textarea id="note" placeholder="今天有什麼想記下來的？"></textarea></section><hr class="rule"><section><div class="section-head"><h3>今日小結</h3></div><div class="grid-two"><div class="stat"><span>✓ 完成</span><strong class="green" id="doneCount">0</strong></div><div class="stat"><span>△ 部分完成</span><strong class="amber" id="partialCount">0</strong></div><div class="stat"><span>× 未完成</span><strong class="red" id="failedCount">0</strong></div><div class="stat"><span>－ 未標記</span><strong id="pendingCount">0</strong></div></div></section><hr class="rule"><section><div class="section-head"><h3>每日簽名</h3></div><div class="signature-box"><label for="signature">給今天努力的自己留個名字</label><input id="signature" placeholder="簽名：________________"></div><div class="button-row"><button type="button" class="secondary" id="signToday">今日簽名</button><button type="button" class="secondary" id="saveSignature">設為常用簽名</button><button type="button" class="secondary" id="useSignature">使用常用簽名</button><button type="button" class="secondary" id="clearSignature">清除簽名</button></div></section><hr class="rule"><div class="floating-note"><strong id="syncInfo">正在同步任務…</strong><span>心情、進度及簽名保存在此瀏覽器。</span></div><div class="button-row"><button type="button" class="secondary" id="exportBtn">匯出備份</button><button type="button" class="secondary" id="importBtn">匯入備份</button><input id="importFile" type="file" accept="application/json,.json" hidden><button type="button" class="secondary" id="printBtn">列印 / 儲存 PDF</button></div><p class="footnote">任務完成狀態與時間管理共用；每日紀錄保存在此瀏覽器，建議匯出備份。</p></main></div><canvas id="fire" aria-hidden="true"></canvas><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const KEY='tm_daily_journal_live_v1';const $=id=>document.getElementById(id);const dateLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const dateFrom=s=>new Date(s+'T12:00:00');const defaultDB=()=>({days:{},recurring:[],commonSignature:''});let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaultDB();if(!db.days||!Array.isArray(db.recurring))throw Error('invalid')}catch{db=defaultDB()}let date=dateLocal(new Date());let remote=[],loaded=false,busy=false;const dayData=()=>db.days[date]||(db.days[date]={tasks:[],note:'',mood:'',signature:'',recurringStatus:{}});const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('儲存失敗，請先匯出備份')}};function toast(s){const el=$('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2400)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const statusLabel=s=>s==='done'?'✓':s==='partial'?'△':s==='failed'?'×':'－';function allTasks(){const day=dayData();return remote.filter(t=>!t.daily&&t.owner!=='peizi'&&(!t.date||t.date<=date)).filter(t=>{if(t.daily)return true;const due=t.dueDate||t.date;const recorded=day.taskStatus?.[String(t.id)];return !!recorded||due===date||(!t.done&&(!due||due<=date))||!!(t.journalCompletedOn===date)}).map(t=>{const id=String(t.id),due=t.dueDate||t.date,late=t.daily||!due?0:Math.max(0,Math.round((Date.parse(date)-Date.parse(due))/86400000));const done=t.daily?(t.completedDates||[]).includes(date):!!t.done&&(!t.journalCompletedOn||t.journalCompletedOn<=date);const own=(t.daily?day.recurringStatus:day.taskStatus)?.[id];const status=done?'done':own==='done'?'pending':own||'pending';const q=t.daily?'in':t.dueDate&&!done&&Date.parse(t.dueDate)-Date.parse(date)<=172800000?'iu':t.quadrant;return {id,name:t.title||'未命名任務',due,late,recurring:!!t.daily,status,quadrant:({iu:'重要且緊急',in:'重要不緊急',nu:'緊急較不重要',nn:'不緊急不重要'})[q]||'重要不緊急'}})}async function loadTasks(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error();const p=await r.json();if(!Array.isArray(p.state?.tasks))throw Error();remote=p.state.tasks;loaded=true;$('syncInfo').textContent='任務已同步';refresh()}catch{$('syncInfo').textContent='任務讀取失敗，請重新整理';}}function prior(t){for(const k of Object.keys(db.days).sort().reverse()){if(k>=date)continue;const v=db.days[k].progress?.[t.id];if(v)return `${k} 進度：${v}`;}return ''}function refresh(){const d=dateFrom(date);$('day').value=date;$('weekday').textContent=`民國 ${d.getFullYear()-1911} 年　${d.getMonth()+1} 月 ${d.getDate()} 日　星期${'日一二三四五六'[d.getDay()]}`;let day=dayData();$('note').value=day.note||'';$('signature').value=day.signature||'';document.querySelectorAll('.mood').forEach(b=>{b.classList.toggle('selected',b.dataset.mood===day.mood);b.setAttribute('aria-pressed',String(b.dataset.mood===day.mood))});const list=allTasks();$('topthree').textContent=`★ 今日最重要三件事 ${(day.stars||[]).length}/3`; const regular=list.filter(t=>!t.recurring),fixed=list.filter(t=>t.recurring);$('taskCounter').textContent=`${regular.length} 件任務`;$('fixedCounter').textContent=`${fixed.length} 件任務`;const renderList=items=>items.length?items.map(t=>`<div class="task ${t.status==='done'?'done':''}" data-id="${escapeHTML(t.id)}" data-rec="${t.recurring?'1':'0'}"><div class="task-main"><div class="task-name"><button class="star ${(day.stars||[]).includes(t.id)?'on':''}" data-star="1" aria-label="標記重要任務">${(day.stars||[]).includes(t.id)?'★':'☆'}</button>${escapeHTML(t.name)}</div><div class="task-meta"><span class="pill">${escapeHTML(t.quadrant||'重要不緊急')}</span>${t.recurring?'<span>每日固定</span>':t.late&&t.status!=='done'?`<span class="overdue">已逾期 ${t.late} 天</span>`:'<span>今日截止</span>'}</div></div><div class="actions"><button type="button" class="mini ${t.status==='done'?'active':''}" data-status="done" aria-label="完成" title="完成">✓</button><button type="button" class="mini ${t.status==='partial'?'partial':''}" data-status="partial" aria-label="部分完成" title="部分完成">△</button><button type="button" class="mini ${t.status==='failed'?'failed':''}" data-status="failed" aria-label="未完成" title="未完成">×</button><button type="button" class="trash" hidden data-delete="1" title="刪除">刪除</button></div>${prior(t)?`<div class="prior">${escapeHTML(prior(t))}</div>`:''}${t.status==='failed'?`<div class="progress-note"><label>未完成原因（選填）</label><select class="reason" data-reason="${escapeHTML(t.id)}">${['','時間不足','臨時有事','難度太高','沒有動力','預估錯誤','其他'].map(v=>`<option value="${v}" ${(day.reasons?.[t.id]||'')===v?'selected':''}>${v||'請選擇原因'}</option>`).join('')}</select><textarea data-detail="${escapeHTML(t.id)}" placeholder="補充原因（選填）">${escapeHTML(day.details?.[t.id]||'')}</textarea></div>`:''}${t.status==='partial'?`<div class="progress-note"><label>今日完成進度</label><textarea data-progress="${escapeHTML(t.id)}" placeholder="今天完成到哪裡了？">${escapeHTML((day.progress||{})[t.id]||'')}</textarea></div>`:''}</div>`).join(''):'<div class="empty">'+(loaded?'此日期沒有待辦事項':'正在讀取任務…')+'</div>';$('taskList').innerHTML=renderList(regular);$('fixedList').innerHTML=renderList(fixed);const statuses=list.map(x=>x.status);$('doneCount').textContent=statuses.filter(x=>x==='done').length;$('partialCount').textContent=statuses.filter(x=>x==='partial').length;$('failedCount').textContent=statuses.filter(x=>x==='failed').length;$('pendingCount').textContent=statuses.filter(x=>!x||x==='pending').length}function changeDate(delta){const d=dateFrom(date);d.setDate(d.getDate()+delta);date=dateLocal(d);refresh()}$('prev').onclick=()=>changeDate(-1);$('next').onclick=()=>changeDate(1);$('today').onclick=()=>{date=dateLocal(new Date());refresh()};$('day').onchange=e=>{if(e.target.value){date=e.target.value;refresh()}};$('taskForm').onsubmit=e=>{e.preventDefault();const name=$('taskName').value.trim();if(!name)return;const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);const recurring=$('taskType').value==='每日固定';let quadrant=$('quadrant').value;if(recurring)quadrant='重要不緊急';const task={id,name,quadrant,status:'pending'};if(recurring)db.recurring.push({...task,start:date});else dayData().tasks.push(task);$('taskName').value='';store();refresh();toast('已新增待辦')};$('fixedList').onclick=$('taskList').onclick=async e=>{const btn=e.target.closest('button');if(!btn)return;const row=btn.closest('.task');if(!row)return;const id=row.dataset.id,rec=row.dataset.rec==='1',day=dayData();if(btn.dataset.star){day.stars=day.stars||[];if(day.stars.includes(id))day.stars=day.stars.filter(x=>x!==id);else if(day.stars.length<3)day.stars.push(id);else{toast('最多選擇三件重要任務');return}}else if(btn.dataset.delete){if(rec){if(!confirm('確定要刪除這項每日固定任務嗎？將停止今天及未來日期顯示，過去紀錄仍可能保留。'))return;const task=db.recurring.find(x=>x.id===id);if(task)task.end=dateLocal(dateFrom(date));const d=dateFrom(date);d.setDate(d.getDate()-1);if(task)task.end=dateLocal(d)}else day.tasks=day.tasks.filter(x=>x.id!==id)}else if(btn.dataset.status){if(busy||!loaded)return;const status=btn.dataset.status,was=allTasks().find(t=>t.id===id)?.status,next=was===status?'pending':status,selectedDate=date;const task=remote.find(t=>String(t.id)===id);if(!task)return;if(!task.daily&&selectedDate!==dateLocal(new Date())&&(next==='done'||was==='done')){toast('一般任務請於今天變更完成狀態');return}busy=true;try{if(next==='done'||was==='done'){const r=await fetch('/api/daily-task-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,date:selectedDate,done:next==='done'})});const p=await r.json();if(!r.ok)throw Error(p.error||'同步失敗');remote=p.tasks;if(next==='done')celebrate()}const map=rec?'recurringStatus':'taskStatus';(day[map]||(day[map]={}))[id]=next;}catch(err){toast(err.message||'同步失敗');return}finally{busy=false}}store();refresh()};document.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{const day=dayData();day.mood=day.mood===b.dataset.mood?'':b.dataset.m
