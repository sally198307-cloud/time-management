<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff9ed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="快速新增"><title>快速新增 | 時間管理</title><link rel="apple-touch-icon" sizes="180x180" href="/quick-add-icon.png?v=yellow2"><link rel="icon" type="image/png" href="/quick-add-icon.png?v=yellow2"><link rel="manifest" href="/quick-add.webmanifest"><style>
:root{color-scheme:light;font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#fff9ed;color:#292719}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 90% 0%,#fff1bf 0%,transparent 42%),#fff9ed}main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 29px) 21px calc(env(safe-area-inset-bottom) + 34px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:29px}.brand small{display:block;color:#ad9161;letter-spacing:.23em;font-size:10px;font-weight:800}.brand h1{font-size:29px;letter-spacing:.08em;margin:4px 0 0;line-height:1.25}.back{font-size:12px;color:#877761;text-decoration:none;background:#fff9;padding:10px 12px;border:1px solid #e8dcc5;border-radius:12px}
.shell{background:#fff;border:1px solid #f0e7d8;border-radius:24px;padding:21px;box-shadow:0 14px 40px #775d2710}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:5px;border-radius:15px;background:#f8f3e9;margin-bottom:22px}.tabs button{border:0;background:transparent;border-radius:11px;padding:13px 4px;font-size:15px;color:#82776a;font-weight:760;cursor:pointer}.tabs button.active{color:#322717;background:#fff;box-shadow:0 2px 8px #74623b18}
label{display:block;font-size:12px;font-weight:760;color:#6b6258;margin-bottom:8px}label span{color:#b05b3a}input,textarea,select{font:inherit;width:100%;border:1px solid #eadfcb;background:#fffdfa;border-radius:12px;padding:12px;color:#292719;min-height:46px;outline:none}input:focus,textarea:focus,select:focus{border-color:#d6ae46;box-shadow:0 0 0 3px #f8d97d40}textarea{resize:vertical;min-height:74px}.field{margin-bottom:17px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;align-items:center;gap:9px;padding:4px 0 16px;color:#4d463e;font-weight:650;font-size:13px}.toggle input{width:18px;height:18px;min-height:0;accent-color:#d4a63b}
.primary{width:100%;background:#f0bd43;border:1px solid #dfab30;color:#30260f;border-radius:14px;min-height:51px;font-size:16px;font-weight:850;cursor:pointer}.primary:disabled{opacity:.5;cursor:wait}.message{margin:14px 0 0;text-align:center;min-height:22px;font-size:13px;font-weight:700}.success{color:#32805f}.error{color:#bd4a42}.muted{color:#8b7f6b}.hidden{display:none!important}.note{font-size:11px;color:#a09480;margin-top:16px;text-align:center}@media(max-width:390px){main{padding-left:13px;padding-right:13px}.shell{padding:16px}.brand h1{font-size:26px}.pair{gap:8px}}
</style></head><body><main><header class="brand"><div><small>QUICK CAPTURE · 快速記錄</small><h1>快速新增<span style="color:#d7a62c">.</span></h1></div></header>
<section class="shell"><div class="tabs" role="tablist" aria-label="新增類型"><button type="button" id="taskTab" class="active" aria-selected="true">✓ 任務</button><button type="button" id="eventTab" aria-selected="false">▦ 行程</button><button type="button" id="memoTab" aria-selected="false">✎ 備忘</button></div>
<form id="form"><div id="commonTitle" class="field"><label for="title">名稱 <span>*</span></label><input id="title" name="title" maxlength="60" placeholder="要做什麼？" autocomplete="off" required autofocus></div>
<div class="field" id="dateRow"><label for="date">日期 <span>*</span></label><input id="date" type="date" name="date" required></div>
<div class="field" id="categoryRow"><label for="category">分類</label><select id="category" aria-label="分類"><option value="">載入分類中…</option></select></div>
<div id="taskFields"><div class="toggle"><input id="daily" type="checkbox"><label for="daily" style="margin:0;font-size:13px">每日固定任務</label></div>
<div class="field" id="dueRow"><label for="dueDate">截止日期（選填）</label><input id="dueDate" type="date"></div>
<div class="field" id="quadrantRow"><label for="quadrant">任務象限</label><select id="quadrant"><option value="in">重要但不緊急</option><option value="iu">重要且緊急</option><option value="nu">緊急但較不重要</option><option value="nn">不緊急也不重要</option></select></div></div>
<div id="eventFields" class="hidden"><div class="pair"><div class="field"><label for="start">開始時間</label><input id="start" type="time" value="09:00"></div><div class="field"><label for="end">結束時間</label><input id="end" type="time" value="10:00"></div></div></div>
<div class="field" id="memoFields" hidden><label for="memoText">快速備忘 <span>*</span></label><textarea id="memoText" maxlength="1000" rows="6" placeholder="想到什麼就記下來…"></textarea></div>
<div class="field" id="notesRow"><label for="notes">備註（選填）</label><textarea id="notes" maxlength="500" placeholder="其他細節..."></textarea></div>
<button class="primary" id="submit" type="submit">＋ 新增任務</button><p id="message" class="message" aria-live="polite"></p></form></section><p class="note">儲存後直接同步到時間管理網站</p></main>
<script>
(()=>{const $=id=>document.getElementById(id),p=n=>String(n).padStart(2,'0'),now=new Date(),today=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate());let kind='task';$('date').value=today;$('dueDate').min=today;
function mode(k){kind=k;for(const t of ['task','event','memo']){const tab=$(t+'Tab');tab.classList.toggle('active',k===t);tab.setAttribute('aria-selected',String(k===t))}
const memo=k==='memo',task=k==='task';$('commonTitle').classList.toggle('hidden',memo);$('dateRow').classList.toggle('hidden',memo);$('categoryRow').classList.toggle('hidden',memo);$('taskFields').classList.toggle('hidden',!task);$('eventFields').classList.toggle('hidden',k!=='event');$('memoFields').hidden=!memo;$('memoFields').classList.toggle('hidden',!memo);$('notesRow').classList.toggle('hidden',memo);$('title').required=!memo;$('date').required=!memo;$('memoText').required=memo;$('submit').textContent=task?'＋ 新增任務':memo?'＋ 新增備忘':'＋ 新增行程';$('message').textContent=''}
$('taskTab').onclick=()=>mode('task');$('eventTab').onclick=()=>mode('event');$('memoTab').onclick=()=>mode('memo');
$('date').onchange=()=>{if($('dueDate').value&&$('dueDate').value<$('date').value)$('dueDate').value=$('date').value;$('dueDate').min=$('date').value};
$('daily').onchange=()=>{$('dueRow').classList.toggle('hidden',$('daily').checked);$('quadrant').value=$('daily').checked?'in':$('quadrant').value;$('quadrant').disabled=$('daily').checked};
async function loadCategories(){const select=$('category');try{const response=await fetch('/api/widget-quick-add-categories',{cache:'no-store'});if(!response.ok)throw Error('分類載入失敗');const data=await response.json();if(!Array.isArray(data.categories)||!data.categories.length)throw Error('尚無分類');const previous=select.value;select.replaceChildren();for(const category of data.categories){const option=document.createElement('option');option.value=category.name;option.textContent=category.name;select.appendChild(option)}if([...select.options].some(option=>option.value===previous))select.value=previous;select.disabled=false}catch(e){select.replaceChildren();const option=document.createElement('option');option.value='';option.textContent='使用系統預設分類';select.appendChild(option);select.disabled=true}}
loadCategories();
const form=$('form');form.onsubmit=async ev=>{ev.preventDefault();const title=$('title').value.trim(),date=$('date').value;if(kind!=='memo'&&(!title||!date))return;const body=kind==='memo'?{kind,text:$('memoText').value.trim()}:{kind,title,date,notes:$('notes').value.trim(),category:$('category').value};if(kind==='memo'){if(!body.text)return}else if(kind==='task'){body.daily=$('daily').checked;body.quadrant=body.daily?'in':$('quadrant').value;body.dueDate=body.daily?'':$('dueDate').value;if(body.dueDate&&body.dueDate<date){$('message').textContent='截止日期不能早於開始日期';$('message').className='message error';return}}else{body.start=$('start').value;body.end=$('end').value;if(body.end<=body.start){$('message').textContent='結束時間必須晚於開始時間';$('message').className='message error';return}}
const submit=$('submit');submit.disabled=true;$('message').className='message muted';$('message').textContent='儲存中…';try{const response=await fetch('/api/widget-quick-add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'儲存失敗');$('message').className='message success';$('message').textContent='✓ 已新增'+(kind==='task'?'任務':kind==='memo'?'備忘':'行程');$('title').value='';$('notes').value='';$('memoText').value='';(kind==='memo'?$('memoText'):$('title')).focus()}catch(e){$('message').className='message error';$('message').textContent=e.message||'儲存失敗，請重試'}finally{submit.disabled=false}}})();
</script></body></html>
