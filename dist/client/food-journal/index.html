<style>

;border-radius:12px}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#283b2c80;display:none;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{width:100%;max-width:680px;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;background:var(--bg);padding:20px 17px calc(24px + env(safe-area-inset-bottom))}.upload{background:#fafbf8;border:2px dashed #cad9c6;border-radius:13px;padding:16px;text-align:center;cursor:pointer;display:block}.upload input{display:none}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:7px 0}.thumbwrap{position:relative;flex:none}.thumbwrap img{width:88px;height:88px;object-fit:cover;border-radius:9px}.thumbwrap button{position:absolute;right:2px;top:2px;border:0;background:#fff;border-radius:50%}.history-item{display:block;text-align:left;width:100%;padding:12px;border:0;background:#f4f7f0;border-radius:12px;margin:7px 0;color:var(--ink)}.day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day-picker button{border:0;padding:11px 0;background:#f5f7f2;border-radius:9px;color:var(--ink)}.day-picker button.selected{background:#dcebdc;font-weight:800}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.report-box{border-radius:13px;background:#f5f7f1;padding:11px}.report-box .input{margin-top:7px}.separator{border:0;border-top:1px solid var(--line);margin:16px 0}.note{padding:11px;border-radius:11px;background:#f4f7f1;font-size:12px;color:#607664;line-height:1.7}.weekly-day{background:white;border-radius:14px;padding:15px;margin:10px 0;border:1px solid var(--line)}.weekly-day h3{margin:0 0 9px}.weekly-photos{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.weekly-photos img{width:80px;height:80px;object-fit:cover;border-radius:7px}.weekly-meal{padding:9px 0;border-top:1px solid #edf0e9}.weekly-meal:first-child{border:0}.weekly-kv{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;font-size:12px}.help{line-height:1.7;color:#728574;font-size:12px}.quota-compact{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f2f5ef;border:1px solid #e4e9e0;border-radius:12px;padding:10px 13px;margin-bottom:14px;font-size:13px;color:#526750}.quota-compact strong{white-space:nowrap}.recommend-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #ecf0e9}.recommend-desc{display:flex;flex-direction:column;gap:3px;min-width:0}.recommend-desc strong{color:#344e3a;font-size:14px}.recommend-desc span{font-size:12px;color:#809080}.recommend-card .smallbtn{white-space:nowrap}.food-filters{display:flex;gap:7px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}.food-filter{background:#f7f8f4;border:1px solid #e0e7de;color:#637a67;border-radius:999px;padding:7px 13px;font-size:12px;white-space:nowrap}.food-filter.selected{background:#e6eee4;border-color:#89a58d;color:#38583f;font-weight:700}.nutrition-combo{padding:11px 0;border-top:1px solid #e9eee6}.nutrition-combo strong{font-size:13px;color:#385540}.nutrition-combo .combo-names{font-size:14px;line-height:1.6;color:#304b38;margin:5px 0}.nutrition-combo .small{line-height:1.5}.nutrition-combo button{white-space:nowrap}.history-record{border-radius:12px;background:#f4f7f0;margin:7px 0;overflow:hidden}.history-record .history-item{margin:0;border-radius:0}.history-actions{display:flex;gap:7px;padding:0 10px 10px}.history-actions .btn{font-size:12px}.guide-shell{border:1px solid #e2e8df;border-radius:14px;margin:0 0 15px;overflow:hidden;background:#f9faf7}.guide-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:13px 14px;background:transparent;color:#405743;border:0}.guide-trigger-text{display:flex;flex-direction:column;gap:3px}.guide-trigger-text strong{font-size:14px}.guide-trigger-text small{font-size:11px;color:#849284}.guide-detail{border-top:1px solid #e4ebe1;padding:12px 14px 15px}.guide-note{font-size:12px;line-height:1.8;color:#617562;margin-bottom:10px}.guide-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #e4e9e1;font-size:12px}.guide-row strong{color:#435b46;white-space:nowrap;font-size:12px}.guide-grades{display:grid;gap:10px}.guide-grades>div{background:#fff;border:1px solid #e8ede6;border-radius:10px;padding:12px}.guide-grades strong{color:#38543f;font-size:16px;margin-right:8px}.guide-grades span{font-size:12px;color:#849485}.guide-grades p{font-size:12px;line-height:1.7;color:#607563;margin:6px 0 0}#printArea{display:none}#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#344d3b;color:white;border-radius:12px;padding:10px 15px;display:none;z-index:30;white-space:nowrap;max-width:94vw}input[type=date]{max-width:165px}.hidden{display:none!important}

<body><div class="app"><header class="header"><div><div class="eyebrow">MY FOOD JOURNAL · DAILY NOTES</div><div class="brand">日日好食 ♡</div></div><div class="leaf">🌿</div></header><div id="content"></div></div><nav class="tabbar"><div class="tab-inner" id="tabs"></div></nav><div class="modal-backdrop" id="backdrop"><div class="modal" id="modal"></div></div><div id="toast"></div><div id="printArea"></div>
<script src="./cloudflare-sync.js?v=1"></script>
<script>
(()=>{'use strict';
const categories=['主食','蛋白質','蔬菜'],goals=[3,3,4],mealTypes=['早餐','午餐','晚餐','點心'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const pad=n=>String(n).padStart(2,'0'); const dateAdd=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d+n);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const weekStart=s=>{const [y,m,d]=s.split('-').map(Number);const day=new Date(y,m-1,d).getDay();return dateAdd(s,-((day+3)%7))};
const dateLabel=s=>{const [y,m,d]=s.split('-').map(Number);return `${m}月${d}日 星期${'日一二三四五六'[new Date(y,m-1,d).getDay()]}`};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const empty=()=>({meals:[],waters:[],reports:{},library:[]});
let data=empty(),page='today',date=today(),selectedWeek=weekStart(today()),editing=null,photos=[],memoryOpen=false,libraryMode=false,historyLimits=['','',''],historyKeyword='',guideOpen=false,guideSection='convert';
const root=document.getElementById('content'),modal=document.getElementById('modal'),backdrop=document.getElementById('backdrop');
let db=null,cloudClient=null;
function openDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return}const r=indexedDB.open('dailyfood_journal',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbGet(){return new Promise((res,rej)=>{const t=db.transaction('state','readonly');const r=t.objectStore('state').get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbSet(v){return new Promise((res,rej)=>{const t=db.transaction('state','readwrite');t.objectStore('state').put(v,'main');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const cloud={repo:'',token:'',password:'',connected:false,sha:null,status:'尚未連接私人儲存庫',timer:null,busy:false,dirty:false};
const encoder=new TextEncoder(),decoder=new TextDecoder();
function b64(bytes){let t='';for(let i=0;i<bytes.length;i+=8192)t+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(t)}
function unb64(s){const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function deriveKey(password,salt){const base=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(cloud.password,salt);const payload=encoder.encode(JSON.stringify({format:'daily-food-journal-v1',savedAt:new Date().toISOString(),data}));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload));return JSON.stringify({format:'daily-food-encrypted-v1',salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)})}
async function decryptData(file){const item=JSON.parse(file);if(item.format!=='daily-food-encrypted-v1')throw Error('GitHub 資料格式不符');const key=await deriveKey(cloud.password,unb64(item.salt));const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(item.iv)},key,unb64(item.ciphertext));const out=JSON.parse(decoder.decode(raw));if(out.format!=='daily-food-journal-v1'||!Array.isArray(out.data?.meals)||!Array.isArray(out.data?.waters))throw Error('備份內容不正確');return out.data}
const cloudPath='private-backups/journal.enc.json';
async function ghApi(path,method='GET',body){const res=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+cloud.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(res.status===404)return {missing:true};if(!res.ok){let msg='HTTP '+res.status;try{const j=await res.json();msg=j.message||msg}catch{}throw Error(msg)}return res.json()}
async function remoteFile(){return ghApi('/repos/'+cloud.repo+'/contents/'+cloudPath)}
function cloudNotice(message){cloud.status=message;const el=document.getElementById('cloudStatus');if(el)el.textContent=message}
async function cloudConnect(){const repo=document.getElementById('cloudRepo')?.value.trim()||'',token=document.getElementById('cloudToken')?.value.trim()||'',password=document.getElementById('cloudPassword')?.value||'';if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)||!token||password.length<16){cloudNotice('請填寫公開儲存庫、Token，以及至少 16 字元的加密密碼');return}cloud.repo=repo;cloud.token=token;cloud.password=password;cloudNotice('正在檢查 GitHub 儲存庫寫入權限…');try{const info=await ghApi('/repos/'+repo);if(info.missing)throw Error('找不到儲存庫或沒有存取權限');if(info.private===false&&!confirm('注意：這是公開儲存庫。所有人都能下載你的加密備份並長期留存副本。若加密密碼外洩或太弱，照片、飲食及健康紀錄可能曝光。確定仍要使用這個公開儲存庫嗎？'))throw Error('已取消公開儲存庫連線');if(!info.permissions?.push)throw Error('沒有寫入權限');const existing=await remoteFile();cloud.sha=existing.missing?null:existing.sha;cloud.connected=true;cloudNotice('已連接 GitHub 儲存庫（公開儲存庫中的備份密文任何人都可下載）。'+(cloud.sha?'雲端已有備份，若這台裝置沒有最新資料，請先點「從 GitHub 還原」。':'雲端尚無備份，請點「立即加密備份」。'));render()}catch(e){cloud.connected=false;cloud.token='';cloud.password='';cloudNotice('連線失敗：'+e.message)}}
async function cloudUpload(silent=false){if(!cloud.connected)return;if(cloud.busy){cloud.dirty=true;return}cloud.busy=true;try{if(!silent)cloudNotice('正在加密上傳…');const latest=await remoteFile();const remoteSha=latest.missing?null:latest.sha;if(remoteSha!==cloud.sha){cloud.connected=false;cloudNotice('雲端已被其他裝置更新，為避免覆蓋資料，已停止同步。請重新連線並先還原／備份。');return}const content=b64(encoder.encode(await encryptData()));if(content.length>20*1024*1024)throw Error('備份太大。GitHub 不適合大量照片，請先下載 JSON 備份並改用專用雲端照片儲存');const body={message:'Encrypted food journal backup '+new Date().toISOString().slice(0,10),content,...(cloud.sha?{sha:cloud.sha}:{})};const result=await ghApi('/repos/'+cloud.repo+'/contents/'+cloudPath,'PUT',body);cloud.sha=result.content.sha;cloudNotice('✓ GitHub 加密備份完成：'+new Date().toLocaleString('zh-TW'));}catch(e){cloudNotice('雲端備份失敗：'+e.message)}finally{cloud.busy=false;if(cloud.dirty&&cloud.connected){cloud.dirty=false;cloudQueue()}}}
async function cloudDownload(){if(!cloud.connected)return;if(!confirm('從 GitHub 還原會覆蓋目前這台裝置的紀錄。請先下載本機 JSON 備份。確定繼續？'))return;try{cloudNotice('正在下載並解密…');const remote=await remoteFile();if(remote.missing)throw Error('雲端尚無備份');const raw=remote.content?decoder.decode(unb64(remote.content.replace(/\s/g,''))):decoder.decode(unb64((await ghApi('/repos/'+cloud.repo+'/git/blobs/'+remote.sha)).content.replace(/\s/g,'')));const restored=await decryptData(raw);data=restored;data.reports||={};cloud.sha=remote.sha;await persist(false);render();cloudNotice('✓ 已從 GitHub 還原日記及照片');}catch(e){cloudNotice('還原失敗：'+e.message+'。請確認加密密碼正確')}}
function cloudQueue(){if(!cloud.connected)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>cloudUpload(true),3500)}
function cloudDisconnect(){clearTimeout(cloud.timer);cloud.token='';cloud.password='';cloud.connected=false;cloud.sha=null;cloudNotice('已中斷 GitHub，同步停止。本機資料仍保留。');render()}
async function persist(sync=true){try{if(sync&&cloudClient)cloudClient.trackChanges();if(db)await dbSet(data);else localStorage.setItem('dailyfood_journal',JSON.stringify(data))}catch(e){console.error(e);alert('儲存失敗，可能是儲存空間不足。請先匯出備份，並減少照片數量。')}}

function historyMatches(){
 const needle=historyKeyword.trim().toLocaleLowerCase();
 return history().filter(x=>{
  const parts=componentData(x);

  return historyLimits.every((max,i)=>max===''||((Number.isFinite(Number(max))&&Number(max)>=0)&&(Number(x.qty?.[i])||0)<=Number(max)+0.00001));
 });
}

function nutritionCandidates(d=date){
 const remaining=goals.map((g,i)=>Math.max(0,num(g-sums(d)[i])));
 const seen=new Set(),items=[];
 [...data.meals,...(data.library||[])].reverse().forEach(meal=>{
  if(['quota','gather'].includes(meal.kind))return;
  componentData(meal).forEach(c=>{
   const name=c.name.trim(),qty=c.qty.map(Number),key=name.toLocaleLowerCase();
   if(!name||seen.has(key)||qty.length!==3||!qty.every(v=>Number.isFinite(v)&&v>=0)||!qty.some(v=>v>0))return;
   seen.add(key);
   if(qty.every((v,i)=>v<=remaining[i]+0.00001))items.push({name,qty});
  });
 });
 const value=x=>x.qty.reduce((n,v,i)=>n+(remaining[i]>0?v/remaining[i]:0),0);
 return items.sort((x,y)=>value(y)-value(x)).slice(0,20);
}
function nutritionCombos(d=date){
 const remaining=goals.map((g,i)=>Math.max(0,num(g-sums(d)[i])));
 if(remaining.every(v=>v<=0))return [];
 const candidates=nutritionCandidates(d);
 if(!candidates.length)return [];
 const rank=group=>{
  const cover=group.total.reduce((n,v,i)=>n+(remaining[i]>0?v/remaining[i]:0),0);
  const kinds=group.total.filter(v=>v>0).length;
  return cover*100+kinds*2-Math.max(0,group.items.length-1)*1.5;
 };
 let beam=[{items:[],total:[0,0,0],next:0}],found=[];
 for(let depth=1;depth<=4;depth++){
  const expanded=[];
  for(const group of beam)for(let i=group.next;i<candidates.length;i++){
   const item=candidates[i],total=group.total.map((v,j)=>num(v+item.qty[j]));
   if(total.some((v,j)=>v>remaining[j]+0.00001))continue;
   expanded.push({items:[...group.items,item],total,next:i+1});
  }
  if(!expanded.length)break;
  expanded.sort((x,y)=>rank(y)-rank(x));
  found.push(...expanded.slice(0,24));
  beam=expanded.slice(0,65);
 }
 const choices=[],used=new Set();
 found.sort((x,y)=>rank(y)-rank(x));
 for(const group of found){
  const key=group.items.map(x=>x.name).sort().join('|');
  if(used.has(key))continue;used.add(key);
  choices.push(group);
  if(choices.length>=3)break;
 }
 return choices;
}
function recommendationPanel(d=date){
 const remaining=goals.map((g,i)=>num(g-sums(d)[i])),combos=nutritionCombos(d);
 const caption=`目前剩餘：主食 ${remaining[0]}、蛋白質 ${remaining[1]}、蔬菜 ${remaining[2]} 份`;
 const body=combos.length?combos.map((group,i)=>`<div class="nutrition-combo"><div class="row" style="align-items:flex-start;gap:10px"><div style="flex:1"><strong>搭配 ${i+1}</strong><div class="combo-names">${group.items.map(x=>escapeHtml(x.name)).join(' ＋ ')}</div></div><button class="btn smallbtn secondary" data-nutrition-combo="${i}">帶入整組</button></div><div class="small muted">合計：主食 ${num(group.total[0])} · 蛋白質 ${num(group.total[1])} · 蔬菜 ${num(group.total[2])} 份｜${group.items.length} 樣食物</div></div>`).join(''):'<p class="help" style="margin:6px 0">目前沒有符合剩餘份量的歷史食物。記錄更多食物及各自份量，之後就能自動組合推薦。</p>';
 return `<section class="card recommend-card"><div class="row" style="margin-bottom:7px"><h3 style="margin:0">🍽️ 今天可以吃什麼</h3><span class="small muted">營養份量搭配</span></div><p class="small muted" style="margin:0 0 9px">${caption}</p>${body}<p class="help" style="margin:9px 0 0">依歷史紀錄的主食、蛋白質、蔬菜份量搭配，每組最多 4 樣食物、不超過當日剩餘份量。帶入後可修改，儲存才會計入。</p></section>`;
}


function history(){
 const map=new Map();
 [...data.meals,...(data.library||[])].reverse().forEach(record=>{
  // 扣打與聚餐只存在每日手帳，不作為可重用的餐點庫食物。
  if(['quota','gather'].includes(record.kind))return;
  componentData(record).forEach((food,i)=>{
   const name=food.name.trim(),key=name.toLocaleLowerCase();
   if(!name||map.has(key))return;
   const isLibrary=(data.library||[]).some(x=>x.id===record.id);
   map.set(key,{id:isLibrary?record.id:record.id+'::'+i,name,qty:food.qty,components:[food],photos:record.photos||[],kind:record.kind||'normal',foodType:record.foodType||'',libraryEntry:isLibrary});
  });
 });
 return [...map.values()];
}

function reportPage(){const s=sums(),fields=reportFields.map(([k,label,type,options])=>{let control;if(type==='choice')control=`<select class="input" data-report="${k}"><option value="">未填</option>${options.map(v=>`<option value="${v}" ${reportValue(date,k)===v?'selected':''}>${v}</option>`).join('')}</select>`;else control=`<input class="input" data-report="${k}" type="number" min="${type==='scale'?1:0}" max="${type==='scale'?5:999}" step="1" placeholder="未填" value="${escapeHtml(reportValue(date,k))}">`;return `<div class="report-box"><label class="small">${label}</label>${control}</div>`}).join('');return dateHeader()+`<section class="card"><h3>每日健康回報 ☑</h3><div class="note">1. 飲食：目標 3 / 3 / 4；總量 <b>${s.map(num).join(' / ')}</b><br>2. 水：<b>${dailyWater()} ml</b><br>上述兩項會從當天記錄自動帶入。</div><div class="report-grid" style="margin-top:12px">${fields}</div><div style="margin-top:12px" class="actions"><button class="btn secondary" id="copyReport">複製十項回報</button><button class="btn" id="saveReport">儲存回報</button></div><p class="help">不確定的項目可留空，PDF 會顯示「未填」。</p></section>`}
function weekPage(){const end=dateAdd(selectedWeek,6);return `<section class="card"><h3>▤ 每週飲食日記 PDF</h3><p class="help">不加封面或總覽。直接依星期四到下星期三排列：照片、餐點名稱、主食／蛋白質／蔬菜份量，接著是每日十項回報。</p><label class="small">選擇週內任一天</label><input class="input" id="weekPick" type="date" value="${selectedWeek}" style="margin:7px 0 10px"><div class="note">本週扣打＋聚餐：已使用 ${weeklySpecials(selectedWeek).length} / 3 次<br>本週：${selectedWeek.replaceAll('-','/')} ～ ${end.replaceAll('-','/')}</div><div class="actions" style="margin-top:12px"><button class="btn" id="exportPDF">列印／儲存為 PDF</button><button class="btn outline" id="backupBtn">備份資料</button></div><p class="help">按「儲存為 PDF」後會開啟瀏覽器的列印視窗，目的地選「儲存為 PDF」。iPhone 可從列印預覽分享儲存為 PDF。</p></section><div>${Array.from({length:7},(_,i)=>weekPreview(dateAdd(selectedWeek,i))).join('')}</div><section class="card"><h3>資料安全與備份</h3><p class="help">未啟用雲端同步前，紀錄只存於目前的瀏覽器。可在下方設定登入與同步；無論是否同步，都建議定期下載 JSON 備份。</p><div class="actions"><button class="btn secondary" id="backupBtn2">下載 JSON 備份</button><button class="btn outline" id="restoreBtn">匯入備份</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none"></section>${cloudClient?cloudClient.panel():''}`}
function weekPreview(d){const ms=dailyMeals(d),s=sums(d);return `<div class="weekly-day"><h3>${dateLabel(d)}</h3><div class="small muted">今日總量 ${s.map(num).join(' / ')} ｜喝水 ${dailyWater(d)} ml</div>${mealTypes.map(m=>{const rows=ms.filter(x=>x.meal===m);return rows.length?`<div class="weekly-meal"><strong>${m}</strong>${rows.map(x=>`<div class="small" style="margin:5px 0">${escapeHtml(x.name)} ｜${x.qty.map(num).join(' / ')} 份</div>${Array.isArray(x.components)&&x.components.length>1?x.components.map(c=>`<div class="small muted">${escapeHtml(c.name)}：${c.qty.map(num).join(" / ")} 份</div>`).join(""):""}<div class="small" style="color:#b28358">${x.kind==='quota'?'扣打 · 不計每日份量':x.kind==='gather'?'聚餐 · 不計每日份量':''}</div><div class="weekly-photos">${x.photos.map(p=>`<img alt="餐點照片" src="${p}">`).join('')}</div>`).join('')}</div>`:''}).join('')}<hr class="separator"><div class="weekly-kv">${reportPairs(d).map(([k,v])=>`<div>${k}：${escapeHtml(v)}</div>`).join('')}</div></div>`}
function reportPairs(d){const s=sums(d);return [['飲食',`目標3/3/4；總量${s.map(num).join('/')}`],['水',dailyWater(d)+' ml'],['是否邪惡食物',dailyMeals(d).some(x=>x.kind==='quota')?'是':reportValue(d,'evil')||'未填'],['是否聚餐',dailyMeals(d).some(x=>x.kind==='gather')?'是':reportValue(d,'gather')||'未填'],['前一天睡眠',reportValue(d,'sleep')||'未填'],['壓力',reportValue(d,'stress')?reportValue(d,'stress')+'/5':'未填'],['疲勞',reportValue(d,'fatigue')?reportValue(d,'fatigue')+'/5':'未填'],['便便',reportValue(d,'stool')!==''?reportValue(d,'stool')+' 次':'未填'],['水腫',reportValue(d,'swelling')||'未填'],['飽足感',reportValue(d,'satiety')?reportValue(d,'satiety')+'/5':'未填']]}
function render(){tabRender();root.innerHTML=({today:todayPage,history:historyPage,calendar:calendarPage,report:reportPage,weekly:weekPage}[page])()}

function componentData(x){return Array.isArray(x.components)&&x.components.length?x.components.map(c=>({name:String(c.name||''),qty:Array.isArray(c.qty)?c.qty.map(n=>Number(n)||0):[0,0,0]})):[{name:x.name||'',qty:Array.isArray(x.qty)?x.qty.map(n=>Number(n)||0):[0,0,0]}]}
function currentComponents(){return Array.from(document.querySelectorAll('.food-component')).map(row=>({name:row.querySelector('.component-name').value.trim(),qty:Array.from(row.querySelectorAll('.component-qty')).map(el=>Number(el.value))}))}
function totalComponents(){var items=currentComponents(),totals=[0,0,0];items.forEach(x=>x.qty.forEach((n,i)=>totals[i]+=Number.isFinite(n)?n:0));totals.forEach((n,i)=>{var el=document.getElementById('q'+i);if(el)el.value=num(n)});return items}
function addComponent(item){var box=document.getElementById('componentList');if(!box)return;var row=document.createElement('div');row.className='food-component';row.style.cssText='padding:12px;background:#f6f8f3;border-radius:12px;margin:9px 0';var heading=document.createElement('div');heading.className='row';heading.style.gap='8px';var name=document.createElement('input');name.className='input component-name';name.placeholder='食物名稱，例如：便當、燙青菜';name.value=item&&item.name||'';name.style.flex='1';var del=document.createElement('button');del.type='button';del.className='btn outline smallbtn component-delete';del.textContent='移除';heading.append(name,del);row.append(heading);var grid=document.createElement('div');grid.className='grid3';grid.style.marginTop='9px';categories.forEach((label,i)=>{var wrap=document.createElement('div');wrap.className='qty';var cap=document.createElement('label');cap.textContent=label;var val=document.createElement('input');val.className='input component-qty';val.type='number';val.min='0';val.step='0.25';val.value=item&&item.qty?Number(item.qty[i])||0:0;wrap.append(cap,val);grid.append(wrap)});row.append(grid);box.append(row);totalComponents()}
function loadMealComponents(x){var box=document.getElementById('componentList');if(!box)return;box.replaceChildren();componentData(x).forEach(addComponent);totalComponents();document.getElementById('mealName').value=x.name||'';document.getElementById('mealKind').value=x.kind||'normal';document.getElementById('foodType').value=mealFoodType(x);updateGatherFields()}

function showModal(meal='午餐',record=null,asLibrary=false){libraryMode=asLibrary;editing=record?.id||null;photos=[...(record?.photos||[])];memoryOpen=false;backdrop.classList.add('open');modal.innerHTML=`<div class="row"><div><div class="eyebrow">${libraryMode?'MY FOOD LIBRARY':'NEW FOOD ENTRY'}</div><h2 style="margin:4px 0">${record?'編輯':'新增'}${libraryMode?'資料庫餐點':'餐點'} ♡</h2></div><button class="btn outline smallbtn" id="historyToggle">◴ 歷史餐點</button><button class="icon-btn" id="modalClose">✕</button></div><div id="modalHistory"></div><div class="field"><label>這一餐的標題（不影響各食物份量）</label><input class="input" id="mealName" placeholder="整餐名稱，例如便當＋燙青菜" value="${escapeHtml(record?.name||'')}"></div><div class="field"><label>餐點分類（方便資料庫篩選）</label><select class="input" id="foodType">${foodTypes.filter(t=>t!=='全部').map(t=>`<option value="${t}" ${mealFoodType(record||{name:''})===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>餐點種類</label><select class="input" id="mealKind"><option value="normal" ${!record?.kind||record.kind==='normal'?'selected':''}>一般餐點</option><option value="quota" ${record?.kind==='quota'?'selected':''}>扣打</option><option value="gather" ${record?.kind==='gather'?'selected':''}>聚餐</option></select><p class="help">扣打＋聚餐每週合計 3 次，星期四重新開始計算。</p></div><div class="field"><label>餐次</label><select class="input" id="mealType">${mealTypes.map(m=>`<option ${m===(record?.meal||meal)?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>餐點照片（可選多張）</label><label class="upload">📷<br><b>點這裡拍照或選取相簿照片</b><br><span class="small muted">可以先存餐點，稍後再補照片</span><input type="file" id="photoInput" accept="image/*" multiple></label><div id="photoThumbs" class="thumbs"></div></div><div id="gatherHint" class="note" style="display:none;margin:12px 0">扣打與聚餐只需填寫餐點名稱、餐次，照片可自由上傳，不需要填寫或計算營養份量；仍會計入每週扣打／聚餐次數。</div><div id="nutritionFields"><hr class="separator"><div class="row"><h3 style="margin:0">同一張照片中的食物</h3><button type="button" class="btn smallbtn secondary" id="addComponent">＋ 增加食物</button></div><div id="componentList"></div><h3>整餐份量自動加總</h3><div class="grid3">${categories.map((x,i)=>`<div class="qty"><label>${x}</label><input class="input" type="number" min="0" step="0.25" id="q${i}" readonly value="${record?num(record.qty[i]):0}"><span class="small muted">份</span></div>`).join('')}</div><p class="help">每樣食物各自填份量，一張照片只需上傳一次；整餐自動加總。</p></div><button class="btn full" style="margin-top:10px" id="saveMeal">儲存餐點</button>`;renderThumbs();if(record)loadMealComponents(record);else addComponent({name:"",qty:[0,0,0]});if(libraryMode)configureLibraryEditor();updateGatherFields()}
function updateGatherFields(){
 const gather=!libraryMode&&['gather','quota'].includes(document.getElementById('mealKind')?.value);
 const fields=document.getElementById('nutritionFields'),hint=document.getElementById('gatherHint');
 if(fields)fields.style.display=gather?'none':'';
 if(hint)hint.style.display=gather?'block':'none';
}
function configureLibraryEditor(){
 const heading=document.querySelector('#modal h2');if(heading)heading.textContent=editing?'編輯食物':'新增食物';
 const title=document.getElementById('mealName');if(title)title.closest('.field').style.display='none';
 for(const field of ['foodType','mealKind','mealType']){const el=document.getElementById(field);if(el)el.closest('.field').style.display='none'}
 const add=document.getElementById('addComponent');if(add)add.style.display='none';
 const save=document.getElementById('saveMeal');if(save)save.textContent='存入食物資料庫';
}
function renderThumbs(){const el=document.getElementById('photoThumbs');if(el)el.innerHTML=photos.map((p,i)=>`<div class="thumbwrap"><img src="${p}" alt="第${i+1}張餐點照片"><button data-removephoto="${i}" type="button">✕</button></div>`).join('')}
function modalHistory(){memoryOpen=!memoryOpen;const el=document.getElementById('modalHistory');if(memoryOpen)el.innerHTML=`<div class="card" style="margin:12px 0"><input class="input" id="modalSearch" placeholder="搜尋歷史餐點"><div id="modalHistoryList">${historyList(history()).replaceAll('data-usehistory','data-selecthistory')}</div></div>`;else el.innerHTML=''}
function readMeal(){
 const n=document.getElementById('mealName').value.trim(),type=document.getElementById('mealType').value;
 const kind=document.getElementById('mealKind').value;
 const gather=!libraryMode&&(kind==='gather'||kind==='quota');
 const components=gather?[]:totalComponents();
 const q=gather?[0,0,0]:categories.map((_,i)=>Number(document.getElementById('q'+i).value));
 if(!n&&!libraryMode){toast('請輸入餐點名稱');return null}
 if(!gather){
  if(!components.length||components.some(c=>!c.name)){toast('請填寫每一項食物名稱');return null}
  if(components.some(c=>c.qty.some(v=>!Number.isFinite(v)||v<0))){toast('食物份量需為 0 或正數');return null}
  if(q.some(x=>!Number.isFinite(x)||x<0)){toast('份量需要是 0 或正數');return null}
 }
 return {id:editing||id(),date,meal:type,name:libraryMode?components[0].name:n,qty:q,components,kind,foodType:document.getElementById('foodType').value,photos:[...photos]};
}
async function resizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('照片讀取失敗'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('無法開啟圖片'));img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
function closeModal(){backdrop.classList.remove('open');photos=[];editing=null;libraryMode=false}
function copyReport(){const r=reportPairs(date);return `(${date.replaceAll('-','/')})\n${r.map(([k,v],i)=>`${i+1}. ${k}：${v}`).join('\n')}`}
async function copyText(str){try{await navigator.clipboard.writeText(str);toast('已複製，可貼到 LINE')}catch(e){const t=document.createElement('textarea');t.value=str;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('已複製回報')}}
function makePDF(){
 const start=selectedWeek;
 document.title=`飲食紀錄_${start}_${dateAdd(start,6)}`;
 document.getElementById('printArea').innerHTML=Array.from({length:7},(_,i)=>{
  const d=dateAdd(start,i),ms=dailyMeals(d),tot=sums(d);
  const mealHtml=mealTypes.map(m=>{
   const rows=ms.filter(x=>x.meal===m);
   return rows.length?`<section class="print-meal"><h3>${m}</h3>${rows.map(x=>`<div class="print-item"><div class="print-photo-group">${x.photos.length?x.photos.map(p=>`<img src="${p}" alt="餐點照片">`).join(''):'<div class="print-no-photo">未上傳照片</div>'}</div><div class="print-item-info"><strong>${escapeHtml(x.name)}</strong>${x.kind!=='gather'&&Array.isArray(x.components)&&x.components.length>1?x.components.map(c=>`<div class="print-serving">${escapeHtml(c.name)}：主食 ${num(c.qty[0])}／蛋白質 ${num(c.qty[1])}／蔬菜 ${num(c.qty[2])} 份</div>`).join(""):""}${x.kind==='quota'?'<span class="print-special">扣打 · 不計今日份量</span>':x.kind==='gather'?'<span class="print-special">聚餐 · 不計今日份量</span>':`<div class="print-serving">主食 ${num(x.qty[0])} 份</div><div class="print-serving">蛋白質 ${num(x.qty[1])} 份</div><div class="print-serving">蔬菜 ${num(x.qty[2])} 份</div>`}</div></div>`).join('')}</section>`:'';
  }).join('');
  return `<article class="print-day">
   <div class="print-head"><div class="print-brand">飲食紀錄<small>FOOD JOURNAL</small></div><div class="print-date">${dateLabel(d)}</div></div>
   <div class="print-summary">
    <div class="print-stat"><span>目標份量</span><strong>3 / 3 / 4</strong><em>主食／蛋白質／蔬菜</em></div>
    <div class="print-stat"><span>實際份量</span><strong>${tot.map(num).join(' / ')}</strong><em>主食／蛋白質／蔬菜</em></div>
    <div class="print-stat"><span>喝水量</span><strong>${dailyWater(d)} ml</strong><em>當日累計</em></div>
   </div>
   ${mealHtml||'<div style="padding:8mm 0;color:#90a092;font-size:10pt">當日尚無餐點紀錄</div>'}
   <section class="print-report"><h3>DAILY CHECK-IN · 每日十項回報</h3><div class="print-kv">${reportPairs(d).map(([k,v],j)=>`<div>${j+1}. ${k}：${escapeHtml(v)}</div>`).join('')}</div></section>
   <div class="print-footer">飲食紀錄 · ${d}</div>
  </article>`;
 }).join('');
 const imgs=[...document.getElementById('printArea').querySelectorAll('img')];
 Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=res;img.onerror=res}))).then(()=>setTimeout(()=>window.print(),180));
}
function backup(){const blob=new Blob([JSON.stringify({format:'daily-food-journal-v1',created:new Date().toISOString(),data})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`日日好食_備份_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(file){try{const obj=JSON.parse(await file.text());if(obj.format!=='daily-food-journal-v1'||!obj.data||!Array.isArray(obj.data.meals)||!Array.isArray(obj.data.waters)){throw Error('備份格式不正確')}if(!confirm('匯入會覆蓋目前所有日記、照片與喝水紀錄。確定要繼續嗎？'))return;data=obj.data;data.reports||={};data.library||=[];await persist();render();toast('備份匯入完成')}catch(e){alert('匯入失敗：'+e.message)}}
function saveReportsFromInputs(){data.reports[date]??={};document.querySelectorAll('[data-report]').forEach(input=>{data.reports[date][input.dataset.report]=input.value})}
root.addEventListener('input',e=>{if(e.target.id==='historySearch'){historyKeyword=e.target.value;filterHistory()}});
root.addEventListener('change',async e=>{if(e.target.dataset.historyLimit!==undefined){historyLimits[Number(e.target.dataset.historyLimit)]=e.target.value;filterHistory();return}if(e.target.id==='dateInput'){date=e.target.value||today();render()}else if(e.target.id==='monthInput'){date=e.target.value+'-01';render()}else if(e.target.id==='weekPick'){selectedWeek=weekStart(e.target.value);render()}else if(e.target.dataset.report){saveReportsFromInputs();await persist()}});
root.addEventListener('click',async e=>{const target=e.target.closest('button');if(!target)return;if(target.id.startsWith('sync')&&cloudClient){if(await cloudClient.click(target.id))return}if(target.dataset.addmeal){showModal(target.dataset.addmeal);return}if(target.id==='guideToggle'){guideOpen=!guideOpen;render();return}if(target.dataset.guideSection){guideSection=target.dataset.guideSection;render();return}if(target.id==='addToLibrary'){showModal('午餐',null,true);return}if(target.dataset.editlibrary){const rec=(data.library||[]).find(x=>x.id===target.dataset.editlibrary);if(rec)showModal(rec.meal||'午餐',rec,true);return}if(target.dataset.deletelibrary){if(confirm('確定刪除這筆資料庫餐點嗎？既有的每日紀錄不受影響。')){data.library=data.library.filter(x=>x.id!==target.dataset.deletelibrary);await persist();render()}return}if(target.id==='historyRemaining'){historyLimits=goals.map((g,i)=>String(Math.max(0,num(g-sums()[i]))));render();return}if(target.id==='historyClearLimits'){historyLimits=['','',''];historyKeyword='';render();return}if(target.dataset.nutritionCombo!==undefined){const group=nutritionCombos(date)[Number(target.dataset.nutritionCombo)];if(!group){toast('推薦已更新，請重新選擇');return}showModal('午餐');const box=document.getElementById('componentList');box.replaceChildren();group.items.forEach(addComponent);document.getElementById('mealName').value=group.items.map(x=>x.name).join('＋');document.getElementById('mealKind').value='normal';toast('已帶入整組食物，確認份量後再儲存');return}if(target.dataset.recommend){const rec=data.meals.find(x=>x.id===target.dataset.recommend);if(rec){showModal('午餐');loadMealComponents(rec);document.getElementById('mealKind').value='normal';toast('已帶入推薦餐點，確認份量後再儲存')}return}if(target.dataset.water){const ml=Number(target.dataset.water);data.waters.push({id:id(),date,ml});await persist();render();return}if(target.id==='waterAdd'){const ml=Number(document.getElementById('waterCustom').value);if(!Number.isFinite(ml)||ml<=0){toast('請輸入正確的喝水量');return}data.waters.push({id:id(),date,ml});await persist();render();return}if(target.id==='waterUndo'){const i=data.waters.findLastIndex(x=>x.date===date);if(i>=0){data.waters.splice(i,1);await persist();render()}return}if(target.dataset.edit){const rec=data.meals.find(x=>x.id===target.dataset.edit);if(rec)showModal(rec.meal,rec);return}if(target.dataset.del){if(confirm('確定刪除這筆餐點與照片嗎？')){data.meals=data.meals.filter(x=>x.id!==target.dataset.del);await persist();render()}return}if(target.dataset.day){date=target.dataset.day;page='today';render();return}if(target.dataset.usehistory){const rec=findFoodRecord(target.dataset.usehistory);if(rec){page='today';render();showModal('午餐');loadMealComponents(rec);toast('已帶入名稱和上次份量')}return}if(target.id==='saveReport'){saveReportsFromInputs();await persist();toast('每日回報已儲存');return}if(target.id==='copyReport'){saveReportsFromInputs();await persist();await copyText(copyReport());return}if(target.id==='cloudConnect'){await cloudConnect();return}if(target.id==='cloudDisconnect'){cloudDisconnect();return}if(target.id==='cloudUpload'){await cloudUpload();return}if(target.id==='cloudDownload'){await cloudDownload();return}if(target.id==='exportPDF'){makePDF();return}if(target.id==='backupBtn'||target.id==='backupBtn2'){backup();return}if(target.id==='restoreBtn'){document.getElementById('restoreFile').click()}});
root.addEventListener('change',async e=>{if(e.target.id==='restoreFile'&&e.target.files?.[0])await importBackup(e.target.files[0])});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){page=b.dataset.tab;render();window.scrollTo(0,0)}});
backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal()});
modal.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='modalClose'){closeModal();return}if(b.id==='addComponent'){if(libraryMode){toast('資料庫每筆只記一項食物');return}addComponent({name:'',qty:[0,0,0]});return}if(b.classList.contains('component-delete')){if(document.querySelectorAll('.food-component').length<=1){toast('至少保留一項食物');return}b.closest('.food-component').remove();totalComponents();return}if(b.id==='historyToggle'){modalHistory();return}if(b.dataset.selecthistory){const rec=findFoodRecord(b.dataset.selecthistory);if(rec){loadMealComponents(rec);modalHistory();toast('已自動帶入歷史份量')}return}if(b.dataset.removephoto){photos.splice(Number(b.dataset.removephoto),1);renderThumbs();return}if(b.id==='saveMeal'){const rec=readMeal();if(!rec)return;if(libraryMode){if(rec.components.length!==1){toast('資料庫每筆只能新增一項食物');return}data.library||=[];const libraryIndex=data.library.findIndex(x=>x.id===rec.id);if(libraryIndex>=0)data.library[libraryIndex]=rec;else data.library.push(rec);await persist();closeModal();render();toast('已存入歷史餐點庫，不計入今日份量');return}const i=data.meals.findIndex(x=>x.id===rec.id);if(['quota','gather'].includes(rec.kind)&&weeklySpecials(date,rec.id).length>=3){toast('本週扣打＋聚餐已使用 3 次，不能再新增');return}if(i>=0)data.meals[i]=rec;else data.meals.push(rec);await persist();closeModal();render();toast(['quota','gather'].includes(rec.kind)?'已記錄於當日手帳，不加入餐點庫':'餐點與份量已儲存')}});
modal.addEventListener('input',e=>{if(e.target.classList.contains('component-qty'))totalComponents();if(e.target.id==='modalSearch'){document.getElementById('modalHistoryList').innerHTML=historyList(history().filter(x=>x.name.toLowerCase().includes(e.target.value.toLowerCase()))).replaceAll('data-usehistory','data-selecthistory')}});
modal.addEventListener('change',async e=>{if(e.target.id==='mealKind'){updateGatherFields();return}if(e.target.id==='photoInput'){const files=[...e.target.files];for(const f of files){try{const p=await resizePhoto(f);photos.push(p)}catch(err){toast('部分照片無法讀取')}}renderThumbs();e.target.value=''}});
window.addEventListener('afterprint',()=>{document.title='日日好食｜個人飲食手帳'});
async function init(){try{db=await openDb();data=await dbGet()||empty()}catch(e){console.warn('IndexedDB unavailable',e);try{data=JSON.parse(localStorage.getItem('dailyfood_journal'))||empty()}catch{data=empty()}toast('目前使用瀏覽器備用儲存，建議定期備份')}data.meals||=[];data.waters||=[];data.reports||={};data.library||=[];
// Keep original stored records untouched during startup; never auto-write a migration.
cloudClient=window.FoodJournalCloud?window.FoodJournalCloud.create({get:()=>data,backup,saveMerged:async merged=>{data=merged;await persist(false);render()}}):null;
render();if(cloudClient)cloudClient.init()}
init();
})();
</script></body></html>
